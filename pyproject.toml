[project]
name = "candidate-reader"
version = "0.1.0"
description = "Read candidate CV and constraints into validated structured data."
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai-agents>=0.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pypdf>=5.1",
    "rich>=13.9",
    "typer>=0.15",
]

[project.scripts]
candidate-reader = "candidate_reader.cli:app"
company-reader = "company_reader.cli:app"
comparison = "comparison.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candidate_reader", "src/company_reader", "src/comparison"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
